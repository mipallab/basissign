services:
  basissign-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: basissign-web:latest
    container_name: basissign-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://basissign.com}
      QUOTE_WEBHOOK_URL: ${QUOTE_WEBHOOK_URL:-}
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-cloudflare}
    volumes:
      - basissign_quotes:/app/data/quotes
      - basissign_contacts:/app/data/contacts
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  basissign_quotes:
  basissign_contacts:
